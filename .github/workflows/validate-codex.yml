name: Validate Codex surfaces

on:
  pull_request:
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'plugins/*/.codex-plugin/**'
      - 'plugins/*/agents/**'
      - 'plugins/*/skills/**'
      - '.claude-plugin/marketplace.json'
      - '.agents/**'
      - '.codex/**'
      - 'scripts/**'
      - '.claude/skills/release/SKILL.md'
      - '.github/workflows/validate-codex.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'plugins/*/.codex-plugin/**'
      - 'plugins/*/agents/**'
      - 'plugins/*/skills/**'
      - '.claude-plugin/marketplace.json'
      - '.agents/**'
      - '.codex/**'
      - 'scripts/**'
      - '.claude/skills/release/SKILL.md'
      - '.github/workflows/validate-codex.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bootstrap-tests:
    name: Agent fixtures (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'

      - name: Show pinned Python, system Bash, and jq versions
        run: |
          python3 --version
          /bin/bash --version | head -1
          jq --version

      - name: Run agent-validator fixture suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run bootstrap fixture suite with the system Bash
        run: node --test plugins/solopreneur/skills/codex-agents-bootstrap/tests/*.test.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: validate-codex-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.9'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'

      - name: Regenerate Codex surfaces
        run: ./scripts/generate-codex-manifests.sh

      - name: Check for drift
        run: |
          # `git status --porcelain` instead of `git diff --exit-code`: the
          # generator can also CREATE files (a plugin newly added to the
          # marketplace gets a fresh .codex-plugin/plugin.json), and untracked
          # files are invisible to `git diff`.
          #
          # The wildcard pathspec needs the trailing `/**`: a git pathspec is
          # matched against the full file path, so 'plugins/*/.codex-plugin'
          # alone matches zero tracked files and would wave modified manifests
          # through. (Literal dir pathspecs like '.agents' match recursively.)
          drift="$(git status --porcelain -- 'plugins/*/.codex-plugin/**' '.agents' '.codex')"
          if [[ -n "$drift" ]]; then
            echo "$drift"
            git diff -- 'plugins/*/.codex-plugin/**' '.agents' '.codex'
            echo "::error::Generated Codex surfaces drift from their sources of truth."
            echo "::error::Re-run ./scripts/generate-codex-manifests.sh and commit the result."
            exit 1
          fi

      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.147.0

      - name: Validate structure and install smoke
        run: ./scripts/validate-codex.sh
